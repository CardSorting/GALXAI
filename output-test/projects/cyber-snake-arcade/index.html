<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retro Snake</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-content:center;background:#07110b;color:#9cff57;font-family:monospace;text-align:center}
h1{margin:0 0 10px;font-size:34px;letter-spacing:8px;text-shadow:0 0 12px #61ff2e}
#game{width:min(90vw,400px);height:min(90vw,400px);border:4px solid #9cff57;image-rendering:pixelated;box-shadow:0 0 25px #2d8f25}
#score{margin-top:10px;font-size:18px}
p{font-size:12px;color:#b8d6a8}
</style>
</head>
<body>
<h1>SNAKE</h1>
<canvas id="game" width="400" height="400"></canvas>
<div id="score">SCORE: 0</div>
<p>ARROW KEYS TO MOVE • R TO RESTART</p>
<script>
const c=document.querySelector("#game"),g=c.getContext("2d"),scoreEl=document.querySelector("#score");
c.setAttribute("aria-label","Retro Snake game");
const N=20,S=20,keys={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
let snake,dir,next,food,score,dead;
function place(){do food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};while(snake.some(p=>p.x===food.x&&p.y===food.y))}
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir=next=[1,0];score=0;dead=false;place();draw()}
function turn(e){let d=keys[e.key];if(d){e.preventDefault();if(d[0]*next[0]+d[1]*next[1]!==-1)next=d}else if(e.key.toLowerCase()==="r")reset()}
addEventListener("keydown",turn);
function cell(x,y,color){g.fillStyle=color;g.fillRect(x*S+2,y*S+2,S-4,S-4)}
function draw(){
g.fillStyle="#07110b";g.fillRect(0,0,400,400);
g.strokeStyle="#10351d";g.lineWidth=1;for(let i=0;i<=N;i++){g.beginPath();g.moveTo(i*S,0);g.lineTo(i*S,400);g.moveTo(0,i*S);g.lineTo(400,i*S);g.stroke()}
cell(food.x,food.y,"#ff4f61");snake.forEach((p,i)=>cell(p.x,p.y,i?"#62d83a":"#d8ff7a"));
scoreEl.textContent="SCORE: "+score;
if(dead){g.fillStyle="rgba(0,0,0,.72)";g.fillRect(0,160,400,80);g.fillStyle="#ff7080";g.font="24px monospace";g.textAlign="center";g.fillText("GAME OVER",200,193);g.fillStyle="#9cff57";g.font="14px monospace";g.fillText("PRESS R TO RESTART",200,218)}
}
function step(){
if(dead)return;
dir=next;let h={x:snake[0].x+dir[0],y:snake[0].y+dir[1]};
if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)){dead=true;draw();return}
snake.unshift(h);
if(h.x===food.x&&h.y===food.y){score+=10;place()}else snake.pop();
draw();
}
reset();
setInterval(step,110);
</script>
</body>
</html>
