<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Retro Snake</title>
<style>
body{margin:0;height:100vh;display:grid;place-items:center;background:#101820;color:#9cff57;font-family:monospace}
#game{border:6px solid #9cff57;box-shadow:0 0 25px #52ff52;background:#071007;image-rendering:pixelated}
#ui{text-align:center;margin-top:12px;font-size:16px;text-shadow:0 0 8px #52ff52}
button{margin-top:10px;background:#9cff57;border:0;padding:8px 14px;font:bold 14px monospace;cursor:pointer}
</style>
</head>
<body>
<div>
<canvas id="game" width="400" height="400"></canvas>
<div id="ui">SCORE: <span id="score">0</span><br>ARROW KEYS TO MOVE<br><button onclick="reset()">RESTART</button></div>
</div>
<script>
const c=document.getElementById("game"),x=c.getContext("2d"),s=20,n=20,score=document.getElementById("score");
let snake,food,dir,next,points,timer,dead;
function reset(){
snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
dir=next={x:1,y:0};points=0;dead=false;spawn();score.textContent=0;
clearInterval(timer);timer=setInterval(tick,110);draw();
}
function spawn(){
do food={x:Math.floor(Math.random()*n),y:Math.floor(Math.random()*n)};
while(snake.some(p=>p.x===food.x&&p.y===food.y));
}
function tick(){
if(dead)return;
dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
if(h.x<0||h.y<0||h.x>=n||h.y>=n||snake.some(p=>p.x===h.x&&p.y===h.y)){dead=true;draw();return;}
snake.unshift(h);
if(h.x===food.x&&h.y===food.y){points++;score.textContent=points;spawn();}else snake.pop();
draw();
}
function draw(){
x.fillStyle="#071007";x.fillRect(0,0,400,400);
x.strokeStyle="#123b16";x.lineWidth=1;
for(let i=0;i<=400;i+=s){x.beginPath();x.moveTo(i,0);x.lineTo(i,400);x.moveTo(0,i);x.lineTo(400,i);x.stroke();}
x.fillStyle="#ff4d6d";x.fillRect(food.x*s+3,food.y*s+3,s-6,s-6);
snake.forEach((p,i)=>{x.fillStyle=i?"#9cff57":"#eaffd0";x.fillRect(p.x*s+2,p.y*s+2,s-4,s-4);});
if(dead){x.fillStyle="rgba(0,0,0,.72)";x.fillRect(0,170,400,60);x.fillStyle="#ff4d6d";x.font="bold 24px monospace";x.textAlign="center";x.fillText("GAME OVER",200,208);}
}
addEventListener("keydown",e=>{
const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];
if(!d)return;e.preventDefault();if(d[0]!==-dir.x||d[1]!==-dir.y)next={x:d[0],y:d[1]};
});
reset();
</script>
</body>
</html>
