<h1>Open your monitor</h1>
<p>Run this in your GALX project on the host computer. The monitor opens and signs you in automatically.</p>
<div class="command"><code>npm run relay:open</code><button id="copy" type="button">Copy command</button></div>
<p id="status" role="status">No API key to find or paste.</p>
<small>Your read-only session lasts up to 12 hours. Open the monitor again after the service restarts.</small>
</main></body></html>
