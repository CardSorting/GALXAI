# Host-network TLS edge. The relay services remain loopback-only; the monitor
# stays loopback-only and is reached through an SSH tunnel.
services:
  edge:
    image: ${GALX_CADDY_IMAGE:?Set a reviewed immutable Caddy image}
    platform: linux/amd64
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=16m']
    volumes:
      - ${GALX_CADDYFILE:?Set the private Caddyfile path}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      GALX_CENTRAL_HOST: ${GALX_CENTRAL_HOST:?Set the central TLS hostname}
      GALX_PREMIUM_HOST: ${GALX_PREMIUM_HOST:?Set the Premium TLS hostname}
      GALX_TLS_EMAIL: ${GALX_TLS_EMAIL:?Set the certificate renewal email}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

volumes:
  caddy_data:
  caddy_config:
