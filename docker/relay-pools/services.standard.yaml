# Linux Standard host only. Premium uses a different VM and Docker daemon.
name: galx-standard
services:
  relay:
    image: galxai-relay-standard:candidate-20260915
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ['127.0.0.1:13302:3001']
    volumes: [standard_execution:/state]
    secrets: [{source: runtime_config, target: component-config}]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000,mode=0700']
    restart: 'no'
    stop_grace_period: 35s
    mem_limit: 2g
    pids_limit: 256
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  monitor:
    image: galxai-monitor-standard:candidate-20260915
    user: '1000:1000'
    group_add: ['${GALX_DOCKER_SOCKET_GID:?Set the dedicated host Docker socket group}']
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes: [standard_desktops:/state, /var/run/docker.sock:/var/run/docker.sock]
    secrets: [{source: monitor_config, target: component-config}]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000,mode=0700']
    restart: 'no'
    mem_limit: 384m
    pids_limit: 128
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
volumes:
  standard_execution:
  standard_desktops:
secrets:
  runtime_config: {file: '${GALX_STANDARD_RUNTIME_CONFIG_FILE:?Set the Standard runtime configuration path}'}
  monitor_config: {file: '${GALX_STANDARD_MONITOR_CONFIG_FILE:?Set the Standard monitor configuration path}'}
