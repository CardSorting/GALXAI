name: Vercel Pre-Deployment & Integrity Check

permissions:
  contents: read

concurrency:
  group: vercel-preflight-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  preflight-audit:
    name: Vercel Pre-Flight Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      NEXT_PUBLIC_APP_URL: https://galx.invalid
      NEXT_PUBLIC_SUPABASE_URL: https://supabase.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_fixture

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify documentation and incident prevention records
        run: npm run docs:check

      - name: Verify incident guard rejects unsafe and stale records
        run: npm run test:docs

      - name: Verify public image, identity and ownership boundaries
        run: npm run test:image:security

      - name: Verify account session lifecycle and immediate revocation
        run: npm run test:auth:sessions

      - name: Verify active-session authority in isolated PostgreSQL
        run: npm run test:auth:db

      - name: Verify durable image requests and Favorites in isolated PostgreSQL
        run: npm run test:image:db

      - name: Verify free-generation authority, quota and recovery
        run: |
          npm run test:free-quota
          npm run test:free-quota:db
          npm run test:sites:workspace

      - name: Verify isolated historical image artifact fixture
        run: npm run test:relay:image

      - name: Verify YAML security patch
        run: npm run test:yaml:security

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run 8-Phase Vercel Pre-Flight Audit Engine
        run: npm run vercel:verify -- --offline

      - name: Verify browser agent deployment contract
        run: npm run test:browser-agent

      - name: Verify logical agent session isolation
        run: npm run test:sessions

      - name: Verify cooldown recovery and image retry contract
        run: npm run test:cooldown

      - name: Install isolated database test tools
        run: sudo apt-get update && sudo apt-get install -y postgresql

      - name: Verify egress budgets and bounded replay
        run: PATH="$(pg_config --bindir):$PATH" npm run test:egress

      - name: Verify physical-request budgets and isolated build credentials
        run: npm run test:egress:transport

      - name: Verify controller authority during slow worker I/O
        run: node --import tsx --test scripts/test-relay-capabilities.ts

      - name: ESLint & Style Checks
        run: npm run lint

      - name: TypeScript Type Safety Check
        run: npx tsc --noEmit

      - name: Next.js Production Build
        run: node scripts/build-ci.mjs

      - name: Verify incident records stay outside compiled public assets
        run: npm run docs:check:build
