version: '3.8'

services:
  galxai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: galxai-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - GALX_VAULT_MASTER_SECRET=${GALX_VAULT_MASTER_SECRET:-galxai-apex-vault-master-secret-key-32b}
      - GALX_VAULT_KEY=${GALX_VAULT_KEY:-galxai-apex-vault-master-secret-key-32b}
      - GALX_VAULT_ACTIVE_KEY_VERSION=v1
    volumes:
      - galx_data:/app/.data

volumes:
  galx_data:
